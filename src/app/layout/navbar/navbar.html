<header
    class="flex h-16 items-center justify-between border-b border-slate-200 bg-white px-4 sm:px-6 dark:border-slate-800 dark:bg-slate-900">
    <!-- Left -->
    <div>
        <h1 class="text-lg font-semibold text-slate-900 dark:text-white">
            Dashboard
        </h1>

        <p class="hidden text-xs text-slate-500 sm:block dark:text-slate-400">
            Manage your tasks and projects
        </p>
    </div>

    <!-- Right -->
    <div class="flex items-center gap-3">

        <!-- Notifications -->
        <button type="button"
            class="relative flex h-10 w-10 items-center justify-center rounded-xl text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white"
            aria-label="Notifications">
            🔔

            <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-red-500"></span>
        </button>

        <!-- User -->
        <div class="flex items-center gap-3 rounded-xl border border-slate-200 px-3 py-2 dark:border-slate-700">
            <div
                class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-100 font-semibold text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400">
                A
            </div>

            <div class="hidden sm:block">
                <p class="text-sm font-semibold text-slate-900 dark:text-white">
                    Ahmed
                </p>

                <p class="text-xs text-slate-500 dark:text-slate-400">
                    Developer
                </p>
            </div>
        </div>

        <!-- Logout -->
        <button type="button" (click)="logout()"
            class="rounded-xl px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-red-50 hover:text-red-600 dark:text-slate-400 dark:hover:bg-red-500/10 dark:hover:text-red-400">
            Logout
        </button>

    </div>
</header>
